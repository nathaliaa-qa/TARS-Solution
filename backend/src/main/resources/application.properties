spring.application.name=cadastro-usuarios-backend

# ---- Banco de dados PostgreSQL ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cadastro_usuarios}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- JWT ----
jwt.secret=${JWT_SECRET:c2VjcmV0LWRlLWRlc2Vudm9sdmltZW50by1uYW8tdXNhci1lbS1wcm9kdWNhbw==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- ViaCEP ----
viacep.base-url=https://viacep.com.br/ws

# ---- Cache (Caffeine) ----
spring.cache.type=caffeine
spring.cache.cache-names=cepCache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

server.port=${PORT:8080}
